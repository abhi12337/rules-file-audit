[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-file-audit"
version = "0.1.0"
description = "Static audit of AI coding-assistant rules files (.cursorrules, CLAUDE.md, AGENTS.md, copilot-instructions.md) and agent permission configs: hidden Unicode, hidden instructions, exfiltration, auto-approve settings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abheesht Tripathi" }]
keywords = ["security", "prompt-injection", "cursorrules", "claude-code", "copilot", "ai-agents", "supply-chain", "unicode", "static-analysis", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rules-file-audit = "rules_file_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[project.urls]
Homepage = "https://github.com/abhi12337/rules-file-audit"
Issues = "https://github.com/abhi12337/rules-file-audit/issues"
